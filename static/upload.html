<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GovDoc | Upload</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell docs">
    <header class="site-header">
      <a class="brand" href="/">
        <div class="logo">GD</div>
        <div><h1>GovDoc</h1><div class="sub">Government document assistance</div></div>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="/">Assistant</a>
        <a href="/documents">Documents</a>
        <a href="/upload" aria-current="page">Upload</a>
      </nav>
    </header>
    <main class="panel">
      <div class="panel-head">
        <div>
          <h2>Upload a PDF</h2>
          <p>Add a reference document. Scanned Malayalam and English pages can be read. Each PDF must be 25 MB or smaller.</p>
        </div>
        <div class="sub" id="collection-status">Checking collection…</div>
      </div>
      <label class="dropzone" id="dropzone">
        <strong>Choose PDFs</strong>
        <span>or drop them here</span>
        <input id="file-input" type="file" accept="application/pdf,.pdf" multiple>
      </label>
      <div class="progress-panel" id="upload-progress" hidden aria-live="polite">
        <strong id="progress-file"></strong>
        <div class="status" id="upload-status"></div>
        <progress id="progress-bar" max="100" aria-label="Document processing progress"></progress>
        <div id="progress-detail"></div>
        <ul id="progress-warnings" hidden></ul>
      </div>
      <div class="doc-tools">
        <button class="secondary" id="reload" type="button">Refresh documents</button>
        <a class="secondary" href="/documents">View documents</a>
      </div>
      <div class="section-title"><span>Your PDFs</span><span id="doc-count">0</span></div>
      <div class="doc-list" id="documents"><div class="empty">No reference materials yet</div></div>
    </main>
  </div>
  <script src="/static/documents.js"></script>
</body>
</html>
